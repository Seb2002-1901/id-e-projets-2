name: ci
on:
  pull_request:
  push: { branches: [main] }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint (inclut no-restricted-imports du module SOS)
        run: pnpm -r lint
      - name: Tests shared/rules — couverture 100 % exigée
        run: pnpm --filter @lucide/shared test -- --coverage --coverageThreshold='{"global":{"branches":100,"functions":100,"lines":100}}'
      - name: Interdits produit — « jour 0 » introuvable (BR-13)
        run: |
          ! grep -rniE "jour 0|day 0|série brisée" apps/mobile/src packages/shared/src --include='*.ts*' \
            || (echo '::error::Chaîne interdite détectée (BR-13)' && exit 1)

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations rejouées de zéro
        run: |
          for f in supabase/migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -U postgres -f "$f"
          done
      - name: Seed de dev
        run: PGPASSWORD=postgres psql -h localhost -U postgres -f supabase/seed/seed.sql
      - name: Tests RLS multi-comptes
        run: PGPASSWORD=postgres psql -h localhost -U postgres -f supabase/tests/rls_test.sql

  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Tests unitaires app (composants, sélecteurs d'état, sync)
        run: pnpm --filter mobile test

  e2e-and-perf:
    # 3 flux critiques + budget perf SOS (< 2 s) — nightly + release, trop lourd par PR
    if: github.event_name == 'push'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Build app de test (simulateur)
        run: pnpm --filter mobile e2e:build
      - name: Detox — onboarding-triage / SOS offline / écart→rebond
        run: pnpm --filter mobile e2e:test
      - name: Budget perf — ouverture SOS < 2000 ms
        run: pnpm --filter mobile perf:sos # échoue si p95 > 2000 ms

  build-preview:
    if: github.ref == 'refs/heads/main'
    needs: [quality, db, mobile-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: EAS build (profil preview, interne)
        run: pnpm exec eas build --platform ios --profile preview --non-interactive
        env: { EXPO_TOKEN: '${{ secrets.EXPO_TOKEN }}' }
