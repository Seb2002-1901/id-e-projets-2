<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" font-family="Poppins, Arial, sans-serif">
  <!-- grille : anneaux 100% et 50% -->
  <polygon points="210,50 316,94 360,200 316,306 210,350 104,306 60,200 104,94" fill="none" stroke="#E6E9EF" stroke-width="1.5"/>
  <polygon points="210,125 263,147 285,200 263,253 210,275 157,253 135,200 157,147" fill="none" stroke="#E6E9EF" stroke-width="1.5"/>
  <!-- axes -->
  <g stroke="#E6E9EF" stroke-width="1">
    <line x1="210" y1="200" x2="210" y2="50"/><line x1="210" y1="200" x2="316" y2="94"/>
    <line x1="210" y1="200" x2="360" y2="200"/><line x1="210" y1="200" x2="316" y2="306"/>
    <line x1="210" y1="200" x2="210" y2="350"/><line x1="210" y1="200" x2="104" y2="306"/>
    <line x1="210" y1="200" x2="60" y2="200"/><line x1="210" y1="200" x2="104" y2="94"/>
  </g>
  <!-- zone remplie (valeurs Lucas) -->
  <polygon points="210,92 278.9,131.1 297,200 274.7,264.7 210,281 167.6,242.4 160.5,200 180.3,170.3"
           fill="#2E5EAA" fill-opacity="0.25" stroke="#1B2A4A" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- sommets colorés par stat -->
  <circle cx="210"   cy="92"    r="5" fill="#3B82C4"/>
  <circle cx="278.9" cy="131.1" r="5" fill="#F5A623"/>
  <circle cx="297"   cy="200"   r="5" fill="#2EC27E"/>
  <circle cx="274.7" cy="264.7" r="5" fill="#E86A5C"/>
  <circle cx="210"   cy="281"   r="5" fill="#8B5CF6"/>
  <circle cx="167.6" cy="242.4" r="5" fill="#4FB0C9"/>
  <circle cx="160.5" cy="200"   r="5" fill="#EC4899"/>
  <circle cx="180.3" cy="170.3" r="5" fill="#B08D57"/>
  <!-- libellés -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <text x="210" y="34"  fill="#3B82C4">Discipline</text>
    <text x="326" y="80"  fill="#F5A623">Courage</text>
    <text x="378" y="205" fill="#2EC27E">Vitalité</text>
    <text x="330" y="330" fill="#E86A5C">Charisme</text>
    <text x="210" y="378" fill="#8B5CF6">Mental</text>
    <text x="94"  y="330" fill="#4FB0C9">Savoir</text>
    <text x="44"  y="205" fill="#EC4899">Création</text>
    <text x="92"  y="80"  fill="#B08D57">Prospérité</text>
  </g>
</svg>
